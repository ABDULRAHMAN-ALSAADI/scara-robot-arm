name: Merge existing SCARA software

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-scara-code.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-software:
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download existing SCARA software repository
        run: |
          git clone --depth 1 https://github.com/ABDULRAHMAN-ALSAADI/SCARA-ROBOT-ARM-SOFTWARE-CODE.git /tmp/scara-software

      - name: Merge and organize firmware and documentation
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p firmware/v10.22
          mkdir -p docs/software
          mkdir -p media/web-interface

          cp -a /tmp/scara-software/SCARA_ROBOT_ARM_CODE_B2/. firmware/v10.22/

          # Never republish personal Wi-Fi passwords in the canonical repository.
          sed -i -E 's#const char\* AP_PASS = ".*";#const char* AP_PASS = "CHANGE_ME";#' firmware/v10.22/SCARA_ROBOT_ARM_CODE.ino
          sed -i -E 's#const char\* STA_SSID = ".*";#const char* STA_SSID = "YOUR_WIFI_SSID";#' firmware/v10.22/SCARA_ROBOT_ARM_CODE.ino
          sed -i -E 's#const char\* STA_PASS = ".*";#const char* STA_PASS = "YOUR_WIFI_PASSWORD";#' firmware/v10.22/SCARA_ROBOT_ARM_CODE.ino

          cp /tmp/scara-software/CALIBRATION_GUIDE.md docs/software/CALIBRATION_GUIDE.md
          cp '/tmp/scara-software/Hardware configuration.md' docs/software/HARDWARE_CONFIGURATION.md
          cp /tmp/scara-software/KINEMATICS.md docs/software/KINEMATICS.md
          cp /tmp/scara-software/SOFTWARE_ARCHITECTURE.md docs/software/SOFTWARE_ARCHITECTURE.md
          cp /tmp/scara-software/TROUBLESHOOTING.md docs/software/TROUBLESHOOTING.md

          rm -f media/web-interface/*.png
          i=1
          for f in /tmp/scara-software/'WEB IMAGE'/*.png; do
            cp "$f" "media/web-interface/web-ui-${i}.png"
            i=$((i+1))
          done

          cat > firmware/README.md <<'EOF'
          # Firmware

          The current robot firmware is **v10.22** and is located in [`v10.22/`](v10.22/).

          The sketch is intentionally split into subsystem tabs so the control logic is easier to inspect and maintain:

          - `SCARA_ROBOT_ARM_CODE.ino` — hardware configuration, shared state, setup and loop
          - `01_DriverControl.ino` — driver enable/disable and emergency stop
          - `02_CalibrationAndStorage.ino` — raw calibration and persistent settings
          - `03_JointCoordinates.ino` — joint/raw-step conversions
          - `04_ForwardKinematics.ino` — FK
          - `05_InverseKinematics.ino` — IK
          - `06_MotionAndSafety.ino` — coordinated motion and safety checks
          - `07_HomingSequence.ino` — homing workflow
          - `08_WebApi.ino` — browser/API control layer
          - `09_SerialDebug.ino` — serial diagnostics
          - `10_GripperControl.ino` — servo gripper
          - `11_CollisionSafety.ino` — collision envelopes and safe routing
          - `12_PackageRecipes.ino` — stored automation recipes
          - `13_ArmJobController.ino` — higher-level job execution
          - `webpage.h` — embedded browser interface

          ## Before flashing

          1. Open `SCARA_ROBOT_ARM_CODE.ino`.
          2. Replace `YOUR_WIFI_SSID` and `YOUR_WIFI_PASSWORD` with your local network details if STA mode is required.
          3. Verify motor direction, steps-per-unit, joint limits, homing direction, and saved calibration against your physical robot.
          4. Read [`../docs/software/CALIBRATION_GUIDE.md`](../docs/software/CALIBRATION_GUIDE.md) before commissioning.

          Wi-Fi passwords from the earlier development repository are intentionally not copied into this canonical repository.
          EOF

          # Remove development-only README from inside the sketch if it adds no build value.
          rm -f firmware/v10.22/README_FIRST.txt

      - name: Commit merged project software
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware docs/software media/web-interface
          if git diff --cached --quiet; then
            echo "No merge changes required."
          else
            git commit -m "Merge v10.22 SCARA firmware and software documentation"
            git push origin main
          fi
